services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dharohar-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ../backend:/var/www/backend
      - ../frontend:/var/www/frontend
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dharohar-network

  # Laravel 13 PHP-FPM Backend (Modular with Nwidart)
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: dharohar-backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dharohar}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-dharohar-assets}
    depends_on:
      - postgres
      - redis
    networks:
      - dharohar-network

  # Next.js Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/docker/frontend/Dockerfile
    container_name: dharohar-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    networks:
      - dharohar-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dharohar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dharohar}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dharohar-network

  # Redis for Queues, Cache & Real-Time Reverb
  redis:
    image: redis:7-alpine
    container_name: dharohar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dharohar-network

  # Laravel Queue Worker & Scheduler
  queue-worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: dharohar-queue
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - dharohar-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  dharohar-network:
    driver: bridge

