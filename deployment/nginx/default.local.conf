# Dharohar Local Reverse Proxy Configuration for dharohar.local

# 1. Main Application & Unified API (dharohar.local)
server {
    listen 80 default_server;
    server_name dharohar.local www.dharohar.local localhost 127.0.0.1;

    client_max_body_size 50M;

    # Backend API Route: Direct to Laravel FastCGI
    location ^~ /api {
        root /var/www/backend/public;
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Storage (Media & Assets)
    location ^~ /storage {
        alias /var/www/backend/public/storage;
        try_files $uri $uri/ =404;
        access_log off;
    }

    # Next.js Frontend App
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Subdomain api.dharohar.local
server {
    listen 80;
    server_name api.dharohar.local;
    root /var/www/backend/public;

    client_max_body_size 50M;
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}
